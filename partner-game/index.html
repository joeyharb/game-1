<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0033A0">
<title>Last Mile Heroes</title>
<meta name="description" content="Partner onboarding game for the IOM South Sudan Core Pipeline (SNFI and WASH).">
<style>
/* =============================================================================
 * LAST MILE HEROES: STYLES
 * Colours are CSS variables; the theme block in CONTENT overrides them.
 * ========================================================================== */
:root {
  --blue: #0033A0; --blue-dark: #00205F; --blue-light: #E6EEFA;
  --bg: #F3F6FB; --text: #14213D; --muted: #55607A; --card: #FFFFFF; --line: #D5DDEB;
  --ok: #12865A; --bad: #C62E2E; --warn: #E08A00; --gold: #F5B301;
  --mc: #F28C28; --mc-text: #14213D;
  --radius: 18px; --shadow: 0 8px 24px rgba(0, 32, 95, .16);
  --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 17px; line-height: 1.45; overscroll-behavior: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
abbr[title] { text-decoration: underline dotted; text-underline-offset: 3px; cursor: help; }
h1, h2, h3 { line-height: 1.15; margin: 0 0 .35em; }
p { margin: 0 0 .6em; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Layers: 3D canvas at the back, UI on top ---------- */
#gl, #c2d { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
#c2d { background: #EAD7BC; }
#ui { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
#ui > * { pointer-events: auto; }
#labels { position: fixed; inset: 0; pointer-events: none; z-index: 4; overflow: hidden; }
#labels > * { position: absolute; left: 0; top: 0; will-change: transform; }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
#toasts { position: fixed; left: 50%; top: 64px; transform: translateX(-50%); width: min(560px, calc(100vw - 20px)); z-index: 25; pointer-events: none; display: flex; flex-direction: column; gap: 6px; }
#modal-root { position: fixed; inset: 0; z-index: 40; pointer-events: none; }
#modal-root > * { pointer-events: auto; }

/* ---------- Buttons ---------- */
.btn { border: 0; border-radius: 999px; padding: 12px 22px; min-height: 48px; font-weight: 800; font-size: 17px; background: var(--blue); color: #fff; box-shadow: 0 4px 0 var(--blue-dark); transition: transform .08s ease, filter .15s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--blue-dark); }
.btn[disabled] { background: #B8C2D6; box-shadow: none; cursor: not-allowed; filter: none; }
.btn.alt { background: #fff; color: var(--blue); box-shadow: inset 0 0 0 2px var(--blue), 0 3px 0 rgba(0,0,0,.08); }
.btn.mc { background: var(--mc); color: var(--mc-text); box-shadow: 0 4px 0 rgba(0,0,0,.25); }
.btn.big { font-size: 20px; padding: 14px 30px; min-height: 58px; }
.btn.sm { font-size: 15px; padding: 7px 14px; min-height: 40px; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); box-shadow: var(--shadow); display: grid; place-items: center; }
.icon-btn svg { width: 24px; height: 24px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--blue-light); color: var(--blue-dark); font-size: 14px; font-weight: 700; }
.ref { background: #FFF4D6; color: #6A4B00; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px; white-space: nowrap; display: inline-block; }
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }

/* ---------- Home ---------- */
.home { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; align-items: center; padding: 14px 12px calc(24px + var(--safe-b)); }
.home-top { width: 100%; max-width: 980px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.logo-slot { height: 46px; display: flex; align-items: center; gap: 8px; }
.logo-slot img { height: 46px; width: auto; background: #fff; border-radius: 8px; padding: 4px 6px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
.logo-ph { height: 42px; padding: 0 10px; border: 2px dashed rgba(255,255,255,.9); border-radius: 8px; color: #fff; font-size: 12px; font-weight: 800; display: grid; place-items: center; background: rgba(0,51,160,.55); line-height: 1.1; text-align: center; }
.home-hero { width: 100%; max-width: 980px; margin-top: 8vh; color: #fff; text-shadow: 0 2px 12px rgba(0,20,60,.45); }
.home-hero h1 { font-size: clamp(38px, 9vw, 76px); font-weight: 900; letter-spacing: -1px; margin: 0; }
.home-hero p { font-size: clamp(16px, 2.6vw, 21px); max-width: 640px; font-weight: 600; }
.home-panel { width: 100%; max-width: 980px; margin-top: 18px; display: grid; grid-template-columns: 1.1fr 1fr; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.field span { font-weight: 800; font-size: 15px; }
.field input, .field select { border: 2px solid var(--line); border-radius: 12px; padding: 11px 12px; font-size: 17px; background: #fff; min-height: 48px; }
.field input:focus, .field select:focus { border-color: var(--blue); outline: none; }
.tracks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.track { border: 3px solid var(--line); background: #fff; border-radius: 16px; padding: 12px; text-align: left; display: flex; flex-direction: column; gap: 4px; min-height: 120px; transition: transform .12s, border-color .12s; }
.track:hover { transform: translateY(-2px); }
.track b { font-size: 20px; }
.track .small { color: var(--muted); }
.track[aria-pressed="true"] { border-color: var(--tc); box-shadow: 0 0 0 4px color-mix(in srgb, var(--tc) 25%, transparent); }
.track .tick { align-self: flex-end; width: 26px; height: 26px; border-radius: 50%; background: var(--line); display: grid; place-items: center; color: #fff; }
.track[aria-pressed="true"] .tick { background: var(--tc); }
.seg { display: inline-flex; background: var(--blue-light); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 15px; min-height: 38px; }
.seg button[aria-pressed="true"] { background: var(--blue); color: #fff; }
.settings-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); }
.toggle { width: 52px; height: 30px; border-radius: 999px; border: 0; background: #C9D2E3; position: relative; transition: background .15s; flex: 0 0 52px; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.toggle[aria-pressed="true"] { background: var(--ok); }
.toggle[aria-pressed="true"]::after { left: 25px; }
.hint { color: var(--bad); font-size: 14px; font-weight: 700; min-height: 1.2em; }

/* ---------- Top bar on map and missions ---------- */
.topbar { position: absolute; left: 8px; right: 8px; top: 8px; display: flex; align-items: center; gap: 8px; }
.pill { background: rgba(255,255,255,.95); border-radius: 999px; box-shadow: var(--shadow); padding: 6px 12px; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; }
.pill svg { width: 22px; height: 22px; }
.hud-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 52px; border-left: 6px solid var(--mc); }
.hearts { display: inline-flex; gap: 2px; }
.hearts svg { width: 22px; height: 22px; }
.heart-lost { animation: heartLost .6s ease; }
@keyframes heartLost { 40% { transform: scale(1.6); } 100% { transform: scale(1); } }
.score { min-width: 64px; justify-content: center; color: var(--blue); }
.streak { color: #D9480F; }
.streak.off { color: #B8C2D6; }
.timer { font-variant-numeric: tabular-nums; }
.phasebar { position: absolute; left: 50%; top: 60px; transform: translateX(-50%); background: rgba(20,33,61,.82); color: #fff; border-radius: 999px; padding: 4px 14px; font-weight: 800; font-size: 14px; white-space: nowrap; max-width: calc(100vw - 20px); overflow: hidden; text-overflow: ellipsis; }

/* ---------- Bottom panel (tray, chips, choices) ---------- */
.dock { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 8px calc(8px + var(--safe-b)); display: flex; flex-direction: column; gap: 8px; align-items: center; }
.dock-inner { width: 100%; max-width: 980px; background: rgba(255,255,255,.96); border-radius: 20px; box-shadow: 0 -4px 24px rgba(0,32,95,.18); padding: 10px; }
.say { display: flex; gap: 10px; align-items: flex-start; }
.say .face { flex: 0 0 52px; width: 52px; height: 52px; }
.say .face svg { width: 52px; height: 52px; display: block; }
.say .who { font-weight: 800; font-size: 13px; color: var(--muted); }
.say .what { font-size: 16px; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
.mchip { border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 8px 12px; font-size: 15px; font-weight: 700; text-align: left; min-height: 44px; transition: transform .1s, opacity .25s; }
.mchip:hover { border-color: var(--mc); }
.mchip.used { opacity: 0; transform: scale(.6); pointer-events: none; }
.mchip.bad { border-color: var(--bad); animation: shake .4s; }
.tray { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 6px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
.scard { flex: 0 0 auto; width: 104px; min-height: 92px; border: 3px solid var(--line); border-radius: 14px; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 6px; font-size: 13px; font-weight: 800; line-height: 1.15; text-align: center; scroll-snap-align: start; transition: transform .12s, border-color .12s; }
.scard svg { width: 34px; height: 34px; }
.scard[aria-pressed="true"] { border-color: var(--mc); transform: translateY(-6px); box-shadow: 0 8px 16px rgba(0,0,0,.18); }
.scard.placed { opacity: .25; pointer-events: none; }
.scard.bad { border-color: var(--bad); animation: shake .4s; }
.options { display: grid; gap: 8px; margin-top: 10px; }
.opt { text-align: left; border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 10px 14px; min-height: 50px; font-size: 16px; font-weight: 700; display: flex; gap: 10px; align-items: center; }
.opt:hover:not([disabled]) { border-color: var(--mc); }
.opt .k { flex: 0 0 28px; height: 28px; border-radius: 50%; background: var(--blue-light); color: var(--blue); display: grid; place-items: center; font-size: 14px; font-weight: 900; }
.opt.right { border-color: var(--ok); background: #E7F6EF; }
.opt.wrong { border-color: var(--bad); background: #FCEBEB; }
.progress { height: 8px; border-radius: 999px; background: var(--blue-light); overflow: hidden; margin-top: 8px; }
.progress > div { height: 100%; background: var(--mc); transition: width .3s; }

/* ---------- World labels ---------- */
.lbl { transform-origin: 50% 100%; font-weight: 800; font-size: 12px; background: rgba(255,255,255,.95); color: var(--text); border-radius: 8px; padding: 2px 7px; white-space: nowrap; box-shadow: 0 3px 8px rgba(0,0,0,.18); pointer-events: none; }
.lbl.tap { pointer-events: auto; border: 0; cursor: pointer; }
.lbl.target { background: var(--mc); color: var(--mc-text); animation: pulse 1s infinite; }
.lbl.ok { background: #E7F6EF; color: #0B5E3E; box-shadow: 0 0 0 2px var(--ok), 0 3px 8px rgba(0,0,0,.18); }
.lbl.doc { white-space: normal; max-width: 128px; text-align: center; line-height: 1.15; border: 2px solid #F5B301; padding: 3px 6px; }
.lbl.slot { white-space: normal; max-width: 150px; min-width: 96px; text-align: center; line-height: 1.15; padding: 5px 7px; border: 2px dashed #19A7E0; }
.lbl.slot.ok { border-style: solid; }
.plotnum { width: 30px; height: 30px; border-radius: 50%; background: var(--mc); color: var(--mc-text); display: grid; place-items: center; font-weight: 900; font-size: 15px; box-shadow: 0 3px 8px rgba(0,0,0,.25); pointer-events: auto; border: 3px solid #fff; padding: 0; }
.plotnum.side { background: #fff; color: var(--mc); border-color: var(--mc); }
.bub { width: 46px; height: 46px; border-radius: 50%; border: 3px solid #fff; background: var(--bc, #0033A0); box-shadow: 0 4px 10px rgba(0,0,0,.28); display: grid; place-items: center; pointer-events: auto; padding: 0; position: absolute; }
.bub svg.ic { width: 24px; height: 24px; color: #fff; }
.bub svg.ring { position: absolute; inset: -6px; width: 58px; height: 58px; transform: rotate(-90deg); pointer-events: none; }
.bub.sel { outline: 4px solid var(--gold); outline-offset: 2px; scale: 1.12; }
.bub.flag { --bc: #D6246E; }
.mapstop { display: flex; flex-direction: column; align-items: center; gap: 2px; background: #fff; border: 3px solid var(--sc); border-radius: 14px; padding: 4px 8px; font-weight: 800; font-size: 12px; box-shadow: 0 6px 14px rgba(0,0,0,.2); pointer-events: auto; min-width: 44px; }
.mapstop .n { background: var(--sc); color: #fff; border-radius: 999px; padding: 0 9px; font-size: 13px; }
.mapstop.locked { border-color: #9AA6BD; opacity: .9; }
.mapstop.locked .n { background: #9AA6BD; }
.mapstop .stars svg { width: 13px; height: 13px; }
.mapstop.sel { outline: 4px solid var(--gold); outline-offset: 2px; }
.mapstop .t { white-space: nowrap; }

/* ---------- Toasts ---------- */
.toast { background: #fff; border-left: 7px solid var(--ok); border-radius: 12px; box-shadow: 0 10px 26px rgba(0,0,0,.22); padding: 8px 12px; font-size: 15px; font-weight: 600; animation: toastIn .25s ease both; }
.toast b { color: var(--ok); }
.toast.bad { border-left-color: var(--bad); }
.toast.bad b { color: var(--bad); }
.toast.info { border-left-color: var(--blue); }
.toast.info b { color: var(--blue); }
@keyframes toastIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }

/* ---------- Modals ---------- */
.overlay { position: absolute; inset: 0; background: rgba(10,20,45,.55); display: grid; place-items: center; padding: 12px; }
.modal { background: var(--card); border-radius: 22px; width: 100%; max-width: 560px; max-height: calc(100dvh - 24px); overflow: auto; box-shadow: 0 30px 60px rgba(0,0,0,.35); animation: popIn .28s ease both; }
.modal-head { background: var(--blue); color: #fff; padding: 14px 18px; border-radius: 22px 22px 0 0; display: flex; gap: 10px; align-items: center; }
.modal-head h2 { margin: 0; font-size: 22px; }
.modal-head.bad { background: var(--bad); }
.modal-head.good { background: var(--ok); }
.modal-head.mc { background: var(--mc); color: var(--mc-text); }
.modal-body { padding: 16px 18px 18px; }
.actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.rule-box { background: #FCEBEB; border-left: 6px solid var(--bad); border-radius: 10px; padding: 10px 14px; margin: 10px 0; }
@keyframes popIn { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: none; } }

/* ---------- Critical consequence scene ---------- */
.crit-veil { position: fixed; inset: 0; z-index: 35; pointer-events: none; background: radial-gradient(ellipse at center, rgba(198,46,46,.05) 30%, rgba(120,10,10,.55) 100%); animation: veil .5s ease both; }
.crit-stamp { position: fixed; left: 50%; top: 40%; z-index: 36; transform: translate(-50%, -50%) rotate(-10deg); color: #fff; background: var(--bad); border: 6px solid #fff; border-radius: 16px; padding: 10px 22px; font-size: clamp(30px, 8vw, 54px); font-weight: 900; letter-spacing: 2px; box-shadow: 0 20px 40px rgba(0,0,0,.4); animation: stampIn .45s cubic-bezier(.3,1.6,.5,1) both; text-align: center; pointer-events: none; }
.crit-stamp small { display: block; font-size: 16px; letter-spacing: 0; font-weight: 700; }
@keyframes veil { from { opacity: 0; } to { opacity: 1; } }
@keyframes stampIn { from { transform: translate(-50%, -50%) rotate(-10deg) scale(2.6); opacity: 0; } to { transform: translate(-50%, -50%) rotate(-10deg) scale(1); opacity: 1; } }

/* ---------- End screen ---------- */
.page { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 12px calc(30px + var(--safe-b)); display: flex; flex-direction: column; align-items: center; }
.page > .card { width: 100%; max-width: 720px; margin-top: 10px; }
.big-stars { display: flex; justify-content: center; gap: 10px; margin: 8px 0; }
.big-stars svg { width: 60px; height: 60px; }
.big-stars .on { animation: starPop .5s ease both; }
.big-stars .on:nth-child(2) { animation-delay: .2s; }
.big-stars .on:nth-child(3) { animation-delay: .4s; }
@keyframes starPop { 0% { transform: scale(0) rotate(-40deg); } 70% { transform: scale(1.25) rotate(8deg); } 100% { transform: scale(1); } }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.stat { background: var(--blue-light); border-radius: 12px; padding: 8px 10px; text-align: center; }
.stat b { display: block; font-size: 24px; color: var(--blue); }
.stat span { font-size: 13px; color: var(--muted); font-weight: 700; }
.review li { margin-bottom: 6px; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.badge { text-align: center; border-radius: 14px; padding: 10px 6px; background: #fff; box-shadow: var(--shadow); font-size: 13px; }
.badge svg { width: 44px; height: 44px; }
.badge b { display: block; font-size: 14px; }
.badge.new { outline: 3px solid var(--gold); }

/* ---------- Effects ---------- */
.spark { position: absolute; width: 9px; height: 9px; border-radius: 50%; animation: spark .7s ease-out forwards; }
@keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
.confetti { position: absolute; top: -20px; width: 9px; height: 15px; border-radius: 2px; animation: fall linear forwards; }
@keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--rot)); } }
.floater { position: absolute; font-weight: 900; font-size: 20px; color: var(--ok); text-shadow: 0 2px 0 #fff, 0 0 8px #fff; animation: floatUp .9s ease-out forwards; transform: translate(-50%, -50%); white-space: nowrap; }
.floater.bad { color: var(--bad); }
@keyframes floatUp { to { transform: translate(-50%, -160%); opacity: 0; } }
.flyer { position: fixed; z-index: 31; pointer-events: none; transition: transform .55s cubic-bezier(.5,-0.2,.6,1), opacity .55s; }
.shake { animation: shake .4s ease; }
@keyframes shake { 20% { translate: -7px 0; } 40% { translate: 7px 0; } 60% { translate: -5px 0; } 80% { translate: 3px 0; } }
/* never animate `transform` on world labels: it carries their position */
@keyframes pulse { 50% { scale: 1.08; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

/* ---------- Responsive ---------- */
@media (max-width: 760px) {
  body { font-size: 16px; }
  .mapstop .t { display: none; }
  .lbl.doc { font-size: 10.5px; max-width: 92px; padding: 2px 4px; }
  .lbl.slot { font-size: 10.5px; max-width: 110px; min-width: 70px; padding: 3px 4px; }
  .lbl { font-size: 11px; }
  .mapstop { padding: 3px 5px; }
  .toast { font-size: 14px; padding: 7px 10px; }
  #toasts { top: 58px; }
  .chips { gap: 5px; }
  .dock-inner { padding: 8px; }
  .phasebar { top: 56px; font-size: 13px; }
  .home-hero { margin-top: 4vh; }
  .home-panel { grid-template-columns: 1fr; }
  .hud-title .t { display: none; }
  .pill { padding: 5px 9px; min-height: 40px; }
  .hearts svg { width: 19px; height: 19px; }
  .scard { width: 88px; min-height: 84px; font-size: 12px; }
  .scard svg { width: 28px; height: 28px; }
  .say .face { flex-basis: 42px; width: 42px; height: 42px; }
  .say .face svg { width: 42px; height: 42px; }
  .say .what { font-size: 15px; }
  .opt { font-size: 15px; padding: 8px 12px; }
  .mchip { font-size: 13.5px; padding: 6px 9px; min-height: 38px; border-radius: 12px; }
  .bub { width: 40px; height: 40px; }
  .bub svg.ring { width: 52px; height: 52px; }
  .bub svg.ic { width: 21px; height: 21px; }
}

@media (max-width: 480px) {
  #hud #mute-btn { display: none; }
  #hud .pill { padding: 4px 8px; gap: 4px; }
  #hud .hearts svg { width: 16px; height: 16px; }
  #hud .icon-btn { width: 40px; height: 40px; }
  .topbar { gap: 5px; left: 6px; right: 6px; }
  .hud-title { min-width: 44px; }
}

/* ---------- Completion card (print) ---------- */
#print-card { display: none; }
@media print {
  @page { size: A4 landscape; margin: 12mm; }
  html, body { overflow: visible; height: auto; background: #fff; }
  body > *:not(#print-card) { display: none !important; }
  #print-card { display: block !important; }
}

</style>
</head>
<body>
<div id="labels" aria-live="off"></div>
<div id="ui"></div>

        { id: 'E-09', speaker: 'mabior', prompt: '"Old Garang cannot walk here. His family is on the list."',
          options: [
            { text: 'Send the door-to-door team to him.', correct: true },
            { text: 'Sorry, kits are only given at the site.', why: 'Door-to-door delivery is for those who cannot reach the site.' }
          ], explain: 'Nobody on the list is left out because they cannot come.', ref: 'SOP §4.6, Table 12' },
        { id: 'E-10', speaker: 'ayen', prompt: '"We have waited so long in the sun!"',
          options: [
            { text: 'Fix it today: move people to the shade and speed up the line.', correct: true },
            { text: 'Note it for next month\'s report.', why: 'Issues raised during a distribution are resolved on the day.' }
          ], explain: 'Feedback is recorded, acted on and closed.', ref: 'SOP §7.3' },
        { id: 'E-11', speaker: 'ayen', prompt: 'The women\'s group asks {demo}.',
          options: [
            { text: 'Run a demonstration and record attendance by sex, age and disability.', correct: true },
            { text: 'No time today.', why: 'Training on item use is part of the job and goes into the report.' }
          ], explain: 'Training and its attendance are reported.', ref: 'SOP §4.7; A1 Step 4' },
        { id: 'E-12', speaker: 'majok', prompt: '"A trader wants the beneficiary list with phone numbers. He says he can help."',
          options: [
            { text: 'No. Beneficiary data is shared only on a need-to-know basis.', correct: true },
            { text: 'Share it, he means well.', critical: 'R8' }
          ], explain: 'Personal data goes to no third party without IOM written permission.', ref: 'AG Art. 3; A6' },
        { id: 'E-13', speaker: 'majok', prompt: '"Where is IOM? We can\'t start without them."',
          options: [
            { text: 'IOM is not at distributions. After handover, it is our responsibility.', correct: true },
            { text: 'Wait for IOM to come and supervise.', why: 'IOM has no presence at distributions; it does PDM on the items afterwards.' }
          ], explain: 'Responsibility passed to your organisation at signature.', ref: 'SOP §4.6 (Registration), §4.5.1' },
        { id: 'E-14', speaker: 'majok', prompt: '"Today\'s team: only men, and nobody trained in PSEA. Let\'s go?"',
          options: [
            { text: 'No: a mixed-gender team trained in PSEA and GBV, with a named team leader.', correct: true },
            { text: 'Go, we are late.', why: 'The team must be mixed-gender and trained in PSEA and GBV risk mitigation.' }
          ], explain: 'The team is part of the distribution standard.', ref: 'SOP §4.6, Table 12' },
        { id: 'E-15', speaker: 'nyakuoth', prompt: 'Another NGO offers to distribute half of your kits in the next village.',
          options: [
            { text: 'No. We distribute directly, without an intermediary.', correct: true },
            { text: 'Yes, it saves time.', critical: 'R7' }
          ], explain: 'Direct distribution is an eligibility condition.', ref: 'SOP §4.2.1' },
        { id: 'E-16', speaker: 'majok', prompt: 'Some kits are left over. "Let\'s keep them in our store for the next project."',
          options: [
            { text: 'Tell the CP team and the cluster in writing. They decide.', correct: true },
            { text: 'Keep them for later.', why: 'Items not distributed cannot be kept, reused or moved without written agreement.' }
          ], explain: 'Leftover items stay your responsibility until redirected.', ref: 'SOP §4.10; AG Art. 2', last: true }
      ]
    },

    /* =========================================================================
     * MISSION 7: REPORT BACK  (SOP §4.7, §4.8, §4.2.3) + the final emergency
     * ======================================================================= */
    {
      id: 'M7', number: 7, title: 'Report Back', place: 'Your office', color: '#D6246E',
      topic: 'Reporting, PDM and compliance', host: 'lual', playable: true,
      intro: 'The distribution is done. Report on time for your track, update the 5W, welcome monitoring, then lead one last emergency.',
      howTo: [
        'Tap the right pieces into the report before the deadline.',
        'Answer the calls.',
        'Finish the emergency: every rule counts.'
      ],
      rulesInPlay: ['R1', 'R2', 'R3', 'R4', 'R5', 'R6', 'R7', 'R8'],
      report: {
        ref: 'SOP §4.7',
        seconds: 24,        // real seconds the calendar takes to reach the track deadline
        callAt: 0.4,        // share of the race when the first call (data request) rings
        pieces: [
          { id: 'P-01', text: 'Signed beneficiary list', good: true },
          { id: 'P-02', text: 'Items distributed, by location', good: true },
          { id: 'P-03', text: 'Results and difficulties', good: true },
          { id: 'P-04', text: 'Any loss or damage', good: true },
          { id: 'P-05', text: 'Photos, with signed consent', good: true },
          { id: 'P-06', text: 'Training on item use: attendance by sex, age and disability', good: true },
          { id: 'P-11', text: 'Estimated numbers, no list', why: 'The report rests on the signed beneficiary list, not estimates.', ref: 'SOP §4.7; A2 §4' },
          { id: 'P-12', text: 'Photos taken without consent', why: 'Images of people require signed consent.', ref: 'SOP §4.6 (Visibility), §4.7' },
          { id: 'P-13', text: 'Names added after the distribution', critical: 'R6', why: 'No name is added to the beneficiary list without IOM written consent.', ref: 'AG Art. 3' },
          { id: 'P-14', text: 'Beneficiary phone list for a trader', critical: 'R8', why: 'Beneficiary data is shared only on a need-to-know basis.', ref: 'AG Art. 3; A6' }
        ],
        badPerRun: 2,
        late: { why: 'The report was late. Late reports trigger a reminder, then a hold on new requests for that state.', ref: 'SOP §4.7, §4.2.3' },
        onTime: { why: 'On time, with the signed list, photos with consent and training attendance.', ref: 'SOP §4.7' }
      },
      callsPerRun: 3,
      firstCall: { id: 'K-01', speaker: 'lual', prompt: 'IOM asks for the beneficiary data. How do you send it?',
        options: [
          { text: 'An encrypted, password-protected Excel file by email; the password by another channel.', correct: true },
          { text: 'A plain list in a WhatsApp group.', critical: 'R8' }
        ], explain: 'Need-to-know, confidential, secure.', ref: 'AG Art. 3; A6' },
      calls: [
        { id: 'K-02', speaker: 'nyakuoth', prompt: 'The month ends. What about the 5W?',
          options: [
            { text: 'Update it by month end, CP team in copy.', correct: true },
            { text: 'Skip it, the report is enough.', why: 'The partner updates the 5W by month end, CP team in copy.' }
          ], explain: 'The 5W shows who is doing what, where.', ref: 'SOP §4.7; A1 Step 4' },
        { id: 'K-03', speaker: 'lual', prompt: 'The CP team arrives for a monitoring visit, without notice.',
          options: [
            { text: 'Welcome them and share our records.', correct: true },
            { text: 'Ask them to come back after giving notice.', why: 'Site visits can happen at any time, and spot checks can be unannounced.' }
          ], explain: 'Records are available on request.', ref: 'AG Art. 5; WS §5; SOP §7' },
        { id: 'K-04', speaker: 'lual', prompt: 'How long do you keep the distribution records?',
          options: [
            { text: 'Seven years after the agreement ends.', correct: true },
            { text: 'Until the report is sent.', why: 'Records are kept for 7 years after termination.' }
          ], explain: 'The CP is donor funded and subject to audit.', ref: 'AG Art. 5; SOP §7' },
        { id: 'K-05', speaker: 'nyakuoth', prompt: 'A partner keeps missing its reports. What happens?',
          options: [
            { text: 'A reminder, then a hold on new requests for that state, then suspension.', correct: true },
            { text: 'Nothing, reports are optional.', why: 'The compliance ladder: reminder, hold, suspension, de-registration.' }
          ], explain: 'Reporting is mandatory.', ref: 'SOP §4.2.3' },
        { id: 'K-06', speaker: 'lual', prompt: 'A suspended partner wants to come back. What is needed?',
          options: [
            { text: 'Meet the obligation, agree a corrective action plan, get written confirmation from the CP Manager.', correct: true },
            { text: 'Just send a new request.', why: 'Reinstatement needs the obligation met, a corrective action plan and written confirmation.' }
          ], explain: 'The path back is clear and written.', ref: 'SOP §4.2.3' }
      ],
      pdmCall: {
        SNFI: { id: 'K-07', speaker: 'lual', prompt: 'Who does post-distribution monitoring (PDM)?',
          options: [
            { text: 'We monitor our whole distribution; the CP team also checks a sample, on the items.', correct: true },
            { text: 'Only IOM does PDM.', why: 'Two PDMs: the partner\'s on the whole process, and the CP team\'s on a sample of distributions.' }
          ], explain: 'PDM runs 2 weeks to 4 months after the distribution.', ref: 'SOP §4.8' },
        WASH: { id: 'K-08', speaker: 'lual', prompt: 'When is your WASH PDM due?',
          options: [
            { text: 'Within 2 months of the distribution, to the WASH Cluster and the CP team, quoting the CPR reference.', correct: true },
            { text: 'Only if IOM asks.', why: 'WASH partners run PDM within 2 months and share it.' }
          ], explain: 'The CP team may also run its own PDM on a sample.', ref: 'WS §5; SOP §4.8' }
      },
      /* The final emergency: one scenario per run. A wrong (non-critical)
       * answer can lead to a consequence node. next: null ends the scenario. */
      finales: [
        { id: 'F-A', title: 'Floods near Bor', start: 'a1', nodes: {
          a1: { speaker: 'nyakuoth', text: 'Floods displace families near Bor. Your organisation is onboarded. What comes first?', ref: 'SOP §4.3',
                options: [{ text: 'Assess the needs within 1 to 5 days, with the cluster.', correct: true, next: 'a2' },
                          { text: 'Go to the warehouse and ask for kits today.', why: 'Stock is released only against an endorsed request, based on a validated assessment.', next: 'a1b' }] },
          a1b: { speaker: 'deng', text: 'The warehouse turns you away: no endorsed request. What now?', ref: 'SOP §4.4, §4.5',
                options: [{ text: 'Assess, then request through the cluster.', correct: true, next: 'a2' },
                          { text: 'Insist until they give in.', why: 'The endorsed request is the only route to release.', next: 'a2' }] },
          a2: { speaker: 'lual', text: 'You request kits for the flooded area. Which hub?', ref: 'SOP §2.2 (Table 3)',
                options: [{ text: 'Bor: it covers Jonglei.', correct: true, next: 'a3' }, { text: 'Wau.', why: 'Wau covers Western Bahr el Ghazal. Bor covers Jonglei.', next: 'a3' }, { text: 'Juba.', why: 'Bor is the hub for Jonglei.', next: 'a3' }] },
          a3: { speaker: 'majok', text: 'On the boat, water ruins some kits.', ref: 'SOP §4.6.2',
                options: [{ text: 'Report within 24 hours on the Loss and Damage form.', correct: true, next: 'a4' }, { text: 'Mention it in the final report.', critical: 'R3' }] },
          a4: { speaker: 'ayen', text: 'At the site, a woman says a staff member asked for sex in exchange for her kit.', ref: 'SOP §7.2, §7.3; IN/234',
                options: [{ text: 'Report it immediately through IOM PSEA channels.', correct: true, next: 'a5' }, { text: 'Log it for the monthly analysis.', critical: 'R4' }] },
          a5: { speaker: 'nyakuoth', text: 'The distribution is done. When is your report due?', ref: 'AG Art. 6; SOP §4.7',
                options: [{ text: 'Within {deadline}, on the {report}.', correct: true, next: null }, { text: 'When we find the time.', why: 'Your track\'s deadline is {deadline}.', next: null }] } } },
        { id: 'F-B', title: 'Returns in Renk', start: 'b1', nodes: {
          b1: { speaker: 'majok', text: 'Returnees arrive in Renk. "River Aid can request and distribute for us!"', ref: 'SOP §4.2.1',
                options: [{ text: 'No. We request and distribute ourselves.', correct: true, next: 'b2' }, { text: 'Great, less work.', critical: 'R7' }] },
          b2: { speaker: 'nyakuoth', text: 'Your assessment of the area is 4 months old.', ref: 'SOP §4.3',
                options: [{ text: 'Do a new one: an assessment is valid for 3 months.', correct: true, next: 'b3' }, { text: 'Use it anyway.', why: 'An assessment is valid for 3 months.', next: 'b2b' }] },
          b2b: { speaker: 'lual', text: 'The CP team returns your request: the assessment has expired. What now?', ref: 'SOP §4.4',
                options: [{ text: 'Do a new assessment and resend, quoting the reference.', correct: true, next: 'b3' }, { text: 'Complain and wait.', why: 'Incomplete requests come back with the correction needed.', next: 'b3' }] },
          b3: { speaker: 'lual', text: 'The state focal point has not answered for 48 hours.', ref: 'SOP §4.4',
                options: [{ text: 'The review passes to national level. We wait for approval.', correct: true, next: 'b4' }, { text: 'Silence means yes: go and collect.', why: 'Silence moves the request up. It is not endorsement.', next: 'b4' }] },
          b4: { speaker: 'mabior', text: '"Ask each family for a small fee for transport."', ref: 'SOP §1, §7.2',
                options: [{ text: 'No. The distribution is free.', correct: true, next: 'b5' }, { text: 'A small fee is fine.', critical: 'R1' }] },
          b5: { speaker: 'majok', text: '"Three late families: add them to the signed list."', ref: 'AG Art. 3',
                options: [{ text: 'Not without IOM written consent.', correct: true, next: null }, { text: 'Add them.', critical: 'R6' }] } } },
        { id: 'F-C', title: 'A rush week', start: 'c1', nodes: {
          c1: { speaker: 'deng', text: 'At collection, someone hands you a waybill to sign.', ref: 'SOP §4.5.2',
                options: [{ text: 'Releases to partners use the issuance form.', correct: true, next: 'c2' }, { text: 'Sign the waybill.', why: 'Waybills are for transfers between IOM locations.', next: 'c2' }] },
          c2: { speaker: 'majok', text: 'A trader offers cash for "spare" kits.', ref: 'AG Art. 3; SOP §4.2.3',
                options: [{ text: 'No sale: the kits go to assessed households.', correct: true, next: 'c3' }, { text: 'Sell the spares.', critical: 'R5' }] },
          c3: { speaker: 'ayen', text: 'A photographer wants pictures of children for the donor.', ref: 'SOP §4.6; A7',
                options: [{ text: 'Only with signed consent. If a child says no, no photo.', correct: true, next: 'c4' }, { text: 'Children are fine without consent.', critical: 'R8' }] },
          c4: { speaker: 'nyakuoth', text: 'The road to the site is blocked. Move the distribution?', ref: 'SOP §4.6.1',
                options: [{ text: 'Justify it in writing, agree with the cluster first, inform the CP team.', correct: true, next: 'c5' }, { text: 'Move now, explain later.', why: 'Changes are agreed with the cluster before implementation.', next: 'c5' }] },
          c5: { speaker: 'lual', text: 'Your report is overdue and a reminder arrives.', ref: 'SOP §4.2.3',
                options: [{ text: 'Send it now: otherwise new requests for the state go on hold.', correct: true, next: null }, { text: 'Ignore the reminder.', why: 'Next comes a hold on new requests for that state.', next: null }] } } }
      ]
    }
  ]
};
</script>

  var h = String(hex).replace('#', ''); if (h.length !== 6) return '#FFFFFF';
  var lin = function (c) { c = parseInt(c, 16) / 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };

function logoHTML(key, label) {
  var src = (C.logos || {})[key];
  return src ? '<img src="' + esc(src) + '" alt="' + esc(label) + ' logo">' : '<span class="logo-ph" title="Add the official logo in CONTENT.logos">' + esc(label) + '<br>logo</span>';
}

var Screens = {
  /* ---------------- Home ---------------- */
  home: function () {
    run = null; clearScreenTimers(); clearUI(); resetAcronyms();
    setMissionColor(document.body, '#0033A0');
    GFX.setView(makeWorldView({ home: true, top: 0, bottom: 0, zoom: 0.92 }));
    var d = Store.get(), p = d.player, s = d.settings;
    var trackBtn = function (id) { var t = C.tracks[id]; return '<button class="track" type="button" data-track="' + id + '" aria-pressed="' + (d.track === id) + '" style="--tc:' + t.color + '"><span class="tick">' + icon('check', '#fff', 'width="16" height="16"') + '</span><b>' + esc(t.short) + '</b><span class="small">' + fmt(t.blurb, false) + '</span><span class="small">Endorsed by the ' + esc(t.cluster) + '</span></button>'; };
    ui().innerHTML = '<div class="home">' +
      '<div class="home-top"><div class="logo-slot">' + logoHTML('iom', 'IOM') + '</div><button class="icon-btn" id="h-mute" aria-label="' + (s.muted ? 'Sound on' : 'Sound off') + '">' + icon(s.muted ? 'mute' : 'sound') + '</button></div>' +
      '<div class="home-hero"><h1>' + esc(C.meta.title) + '</h1><p>' + fmt(C.meta.subtitle, true) + '</p>' +
      '<p class="small" style="opacity:.95">You are the field focal point of <b>' + esc(C.ngo.name) + '</b>, a fictional NGO joining the pipeline. Learn by doing. It is not a test.</p></div>' +
      '<div class="home-panel">' +
        '<section class="card"><h2>About you</h2><p class="small muted">Printed on your completion card and in the results file you can send to the CP team.</p>' +
          '<label class="field"><span>Your name</span><input id="f-name" maxlength="60" autocomplete="name" value="' + esc(p.name) + '" placeholder="Type your name"></label>' +
          '<label class="field"><span>Your organisation</span><input id="f-org" maxlength="80" autocomplete="organization" value="' + esc(p.org) + '" placeholder="Organisation name"></label>' +
          '<label class="field"><span>State where you work</span><select id="f-state"><option value="">Choose a state</option>' + C.states.map(function (x) { return '<option' + (p.state === x ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join('') + '</select></label>' +
          '<div class="field"><span>Your track</span><div class="tracks">' + trackBtn('SNFI') + trackBtn('WASH') + '</div></div>' +
        '</section>' +
        '<section class="card"><h2>Settings</h2>' +
          (GFX.mode === 'webgl' ? '<div class="settings-row"><span><b>Graphics</b><br><span class="small muted">Low is smoother on phones</span></span><span class="seg" role="group" aria-label="Graphics"><button type="button" data-q="high" aria-pressed="' + (GFX.quality === 'high') + '">High</button><button type="button" data-q="low" aria-pressed="' + (GFX.quality === 'low') + '">Low</button></span></div>'
            : '<div class="settings-row"><span><b>Graphics</b><br><span class="small muted">Simple 2D mode: this device has no 3D support.</span></span></div>') +
          '<div class="settings-row"><span><b>Relaxed pace</b><br><span class="small muted">More time in the busy parts</span></span><button class="toggle" type="button" id="t-relax" aria-label="Relaxed pace" aria-pressed="' + !!s.relaxed + '"></button></div>' +
          '<div class="settings-row"><span><b>Sound</b></span><button class="toggle" type="button" id="t-sound" aria-label="Sound" aria-pressed="' + !s.muted + '"></button></div>' +
          '<div class="hint" id="h-hint" role="alert"></div>' +
          '<button class="btn big" id="h-start" style="width:100%;margin-top:6px">' + (Object.keys(d.missions).length ? 'Continue the journey' : 'Start the journey') + '</button>' +
          (Store.available() ? '' : '<p class="small" style="color:var(--warn);margin-top:8px">This browser blocks saving. You can still play; progress is forgotten when you close the page.</p>') +
          '<p class="small muted" style="margin-top:10px">' + esc(C.meta.sourceNote) + '</p>' +
        '</section>' +
      '</div></div>';
    var save = function () { p.name = $('#f-name').value.trim(); p.org = $('#f-org').value.trim(); p.state = $('#f-state').value; Store.save(); };
    ['#f-name', '#f-org', '#f-state'].forEach(function (k) { $(k).addEventListener('input', save); $(k).addEventListener('change', save); });
    $$('.track').forEach(function (b) { b.onclick = function () { d.track = b.getAttribute('data-track'); Store.save(); Sound.tap(); $$('.track').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); }); }; });
    $$('.seg button').forEach(function (b) { b.onclick = function () { GFX.setQuality(b.getAttribute('data-q')); $$('.seg button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); }); }; });
    $('#t-relax').onclick = function () { s.relaxed = !s.relaxed; Store.save(); this.setAttribute('aria-pressed', String(s.relaxed)); };
    $('#t-sound').onclick = function () { s.muted = !s.muted; Store.save(); this.setAttribute('aria-pressed', String(!s.muted)); if (!s.muted) Sound.good(); };
    $('#h-mute').onclick = function () { s.muted = !s.muted; Store.save(); Screens.home(); };
    $('#h-start').onclick = function () {
      save();
      var miss = [];
      if (!p.name) miss.push('your name'); if (!p.org) miss.push('your organisation'); if (!p.state) miss.push('your state'); if (!d.track) miss.push('a track');
      if (miss.length) { $('#h-hint').textContent = 'Please add ' + miss.join(', ') + '.'; Sound.bad(); return; }
      Sound.good(); Screens.map();
    };
  },

  /* ---------------- Map ---------------- */
  map: function () {
    run = null; clearScreenTimers(); clearUI(); resetAcronyms();
    setMissionColor(document.body, '#0033A0');
    var d = Store.get(), t = track();
    var stars = 0; Object.keys(d.missions).forEach(function (k) { var m = d.missions[k]; if (m && m.best) stars += m.best.stars; });
    var next = null; C.missions.forEach(function (M, i) { if (!next && isUnlocked(i) && !(d.missions[M.id] && d.missions[M.id].completed)) next = M; });
    if (!next) C.missions.forEach(function (M, i) { if (!next && isUnlocked(i)) next = M; });
    ui().innerHTML = '<div class="topbar"><button class="icon-btn" id="m-home" aria-label="Home and settings">' + icon('map') + '</button>' +
      '<span class="pill grow" style="min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">Your journey · ' + esc(t.short) + '</span>' +
      '<span class="pill">' + icon('star', 'var(--gold)') + stars + '/' + (C.missions.length * 3) + '</span></div>' +
      '<div class="dock" id="dock"><div class="dock-inner"><div id="m-sel"></div>' +
        (function () { var soon = C.missions.filter(function (m) { return !isPlayable(m); }).map(function (m) { return m.number; }); return soon.length ? '<p class="small muted" style="margin:8px 0 0">Coming soon: Mission' + (soon.length > 1 ? 's ' : ' ') + soon.join(', ') + '.</p>' : ''; })() +
        '<div class="row" style="margin-top:6px"><button class="btn sm alt" id="m-rules">Critical rules</button><button class="btn sm alt" id="m-reset" style="color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)">Reset progress</button></div>' +
      '</div></div>';
    var stopBtns = {};
    function showSel(M) {
      var i = missionIndex(M.id), open = isUnlocked(i), rec = d.missions[M.id] || {};
      Object.keys(stopBtns).forEach(function (k) { stopBtns[k].classList.toggle('sel', k === M.id); });
      $('#m-sel').innerHTML = '<div class="row"><div class="grow" style="min-width:0"><div class="small muted">' + (M === next ? 'Next stop' : 'Stop ' + M.number) + ' · ' + esc(M.place) + ' · ' + esc(M.topic) + '</div>' +
        '<b style="font-size:19px">Mission ' + M.number + ': ' + esc(M.title) + '</b>' + (rec.best ? ' ' + starsHTML(rec.best.stars) : '') + '</div>' +
        (open ? '<button class="btn big mc" id="m-play" style="--mc:' + M.color + ';--mc-text:' + textOn(M.color) + '">' + (rec.completed ? 'Replay' : 'Play') + '</button>'
              : '<span class="chip">' + icon('lock', 'currentColor', 'width="16" height="16"') + (!isPlayable(M) ? ' Coming soon' : ' Locked') + '</span>') + '</div>';
      if (open) $('#m-play').onclick = function () { Screens.intro(M.id); };
      GFX.refit();
    }
    var v = makeWorldView({ top: 66, bottom: function () { var k = $('#dock'); return k ? k.offsetHeight + 6 : 20; } });
    GFX.setView(v);
    v.layout.stops.forEach(function (s, i) {
      var M = s.m, open = isUnlocked(i), rec = d.missions[M.id] || {};
      var b = el('<button class="mapstop' + (open ? '' : ' locked') + '" type="button" style="--sc:' + M.color + '" aria-label="Mission ' + M.number + ': ' + esc(M.title) + (open ? '' : ' (locked)') + '">' +
        '<span class="n">' + (open ? (rec.completed ? '&#10003; ' : '') + M.number : '&#128274; ' + M.number) + '</span><span class="t">' + esc(M.title) + '</span>' + starsHTML(rec.best ? rec.best.stars : 0) + '</button>');
      b.onclick = function () { Sound.tap(); showSel(M); };
      stopBtns[M.id] = b;
      GFX.addLabel(b, function () { return [s.x, 2.6, s.z]; });
    });
    showSel(next || C.missions[0]);
    $('#m-home').onclick = Screens.home;
    $('#m-rules').onclick = showRules;
    $('#m-reset').onclick = function () { confirmModal('Reset progress?', 'This clears scores, stars, badges and unlocks on this device. Your name, organisation, state and track are kept.', 'Reset', function () { Store.reset(); Screens.map(); }); };
  },

  /* ---------------- Mission intro ---------------- */
  intro: function (id) {
    var M = missionById(id); if (!M) return Screens.map();
    resetAcronyms(); setMissionColor(document.body, M.color);
    var back = function () { closeModal(); };
    openModal('<div class="modal-head mc"><h2>Mission ' + M.number + ': ' + esc(M.title) + '</h2></div><div class="modal-body">' +
      sayHTML(M.host || 'mabior', fmt(M.intro, true)) +
      '<ol style="margin:12px 0 6px;padding-left:22px">' + (M.howTo || []).map(function (h) { return '<li>' + fmt(h, true) + '</li>'; }).join('') + '</ol>' +
      '<div class="row" style="margin:8px 0">' + heartsHTML(S.livesPerMission, S.livesPerMission) + '<span class="chip">' + esc(track().short) + ' track</span>' + (Store.get().settings.relaxed ? '<span class="chip">Relaxed pace</span>' : '') + '</div>' +
      ((M.rulesInPlay || []).length ? '<p class="small"><b>Critical rules in play</b> (breaking one stops the mission): ' + M.rulesInPlay.map(function (r) { return esc(C.criticalRules[r].title); }).join(' · ') + '</p>' : '') +
      '<div class="actions"><button class="btn alt" id="i-back">Back</button><button class="btn mc big" id="i-go">Start</button></div></div>', { onEscape: back });
    $('#i-back').onclick = back;
    $('#i-go').onclick = function () { closeModal(); Sound.unlock(); startMission(M.id); };
  },

  /* ---------------- Results ---------------- */
  results: function (rec, newBest, newBadges, newUnlocks) {
    var M = missionById(rec.mission), done = rec.status === 'completed';
    clearUI(); setMissionColor(document.body, M.color);
    var title = done ? 'Mission complete!' : (rec.status === 'critical' ? 'Stopped by a critical rule' : 'Out of lives');
    var line = done ? (rec.stars === 3 ? 'Outstanding. A fair, safe and free distribution.' : 'Well done. Check the topics below, then try for three stars.')
                    : (rec.status === 'critical' ? 'That rule protects people and the pipeline. Read it once more, then go again.' : 'Three slips and the day stops. Review the topics below and try again.');
    var weak = groupRefs(rec.mistakes);
    ui().innerHTML = '<div class="page"><section class="card" style="text-align:center">' +
      '<h2 style="font-size:30px">' + esc(title) + '</h2>' +
      (done ? '<div class="big-stars">' + [0, 1, 2].map(function (i) { return '<span class="' + (i < rec.stars ? 'on' : '') + '">' + icon('star', i < rec.stars ? 'var(--gold)' : '#D5DDEB') + '</span>'; }).join('') + '</div>' : '') +
      '<div class="stats"><div class="stat"><b>' + fmtNum(rec.score) + '</b><span>Points' + (newBest ? ' · new best!' : '') + '</span></div>' +
      '<div class="stat"><b>' + rec.correct + '/' + rec.total + '</b><span>Right moves</span></div>' +
      '<div class="stat"><b>' + pct(rec.accuracy) + '</b><span>Accuracy</span></div>' +
      '<div class="stat"><b>' + rec.maxStreak + '</b><span>Best streak</span></div></div>' +
      '<div style="text-align:left;margin-top:12px">' + sayHTML(M.host || 'mabior', esc(line)) + '</div>' +
      (weak.length ? '<div style="text-align:left;margin-top:10px"><h3>Topics to review</h3><ul class="review">' + weak.map(function (w) { return '<li><span class="ref">' + esc(w.ref) + '</span> ' + w.count + ' slip' + (w.count > 1 ? 's' : '') + '</li>'; }).join('') + '</ul></div>' : '<p style="margin-top:10px"><b>No slips.</b> Every move was right.</p>') +
      (newBadges.length ? '<div style="text-align:left"><h3>New badge' + (newBadges.length > 1 ? 's' : '') + '</h3><div class="badges">' + newBadges.map(function (b) { return '<div class="badge new">' + icon(BADGE_ICON[b.id] || 'star', 'var(--blue)') + '<b>' + esc(b.title) + '</b>' + esc(b.desc) + '</div>'; }).join('') + '</div></div>' : '') +
      (newUnlocks.length ? '<div style="text-align:left;margin-top:10px"><h3>Unlocked</h3>' + newUnlocks.map(function (u) { return '<div class="row" style="margin-bottom:6px">' + (u.kind === 'truckColor' ? '<span style="width:28px;height:28px;border-radius:8px;background:' + u.value + ';display:inline-block"></span>' : icon('banner', C.ngo.color, 'width="28" height="28"')) + '<b class="grow">' + esc(u.label) + '</b>' + (u.kind === 'truckColor' ? '<button class="btn sm" data-equip="' + u.value + '">Use it</button>' : '<span class="small muted">On your compound</span>') + '</div>'; }).join('') + '</div>' : '') +
      '<div class="actions" style="justify-content:center"><button class="btn alt" id="r-map">Map</button><button class="btn mc big" id="r-again">' + (done ? 'Play again' : 'Try again') + '</button></div>' +
      '</section></div>';
    if (done) { Sound.fanfare(); confetti(); }
    $$('[data-equip]').forEach(function (b) { b.onclick = function () { Store.get().truckColor = b.getAttribute('data-equip'); Store.save(); b.textContent = 'In use'; b.disabled = true; }; });
    $('#r-map').onclick = Screens.map;
    $('#r-again').onclick = function () { startMission(M.id); };
    var w = makeWorldView({ top: 0, bottom: 0 }); GFX.setView(w);
  }
};

function showRules() {
  resetAcronyms();
  openModal('<div class="modal-head bad">' + icon('lock', '#fff', 'width="26" height="26"') + '<h2>Critical rules</h2></div><div class="modal-body"><p>Breaking one stops the mission at once.</p>' +
    Object.keys(C.criticalRules).map(function (k) { var r = C.criticalRules[k]; return '<div class="rule-box" style="background:#F6F8FD;border-left-color:var(--blue)"><b>' + fmt(r.title, true) + '</b><p style="margin:.3em 0">' + fmt(r.rule, true) + '</p><span class="ref">' + esc(r.ref) + '</span></div>'; }).join('') +
    '<div class="actions"><button class="btn" id="r-ok">Got it</button></div></div>', { onEscape: closeModal });
  $('#r-ok').onclick = closeModal;
}

/* ---------------- Boot ---------------- */
document.addEventListener('pointerdown', function () { Sound.unlock(); }, { once: true });
GFX.init();
Screens.home();

/* Read-only hook for automated play-testing (no effect on players). */
window.LMH = { store: function () { return Store.get(); }, run: function () { return run; }, fps: function () { return GFX.fps; }, stats: function () { return GFX.stats(); },
  mode: function () { return GFX.mode; }, quality: function () { return GFX.quality; }, screens: Screens, start: startMission, gfx: GFX };

})();
</script>
</body>
</html>
