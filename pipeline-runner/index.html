  /* ===========================================================================
   * 6. LEVEL RUN AND QUESTION TYPES
   * ========================================================================= */
  function startLevel(levelId) {
    var L = levelById(levelId);
    run = {
      level: L, idx: 0, lives: S.livesPerLevel, livesLost: 0, score: 0, streak: 0, maxStreak: 0,
      correct: 0, answered: 0, mistakes: [], critical: null, startedAt: new Date().toISOString(),
      questions: null, total: 0, scenario: null, nodeId: null, current: null, locked: false
    };
    if (L.boss) {
      var sc = shuffle(L.scenarios)[0];
      run.scenario = sc; run.nodeId = sc.start;
    } else {
      var pool = L.questions;
      var n = Math.min(L.questionsPerRun || pool.length, pool.length);
      var always = pool.filter(function (q) { return q.always; });
      var rest = shuffle(pool.filter(function (q) { return !q.always; }));
      run.questions = shuffle(always.concat(rest.slice(0, Math.max(0, n - always.length))));
      run.total = run.questions.length;
    }
    renderQuestion();
  }

  /* Turn a boss node into a choice question so one renderer handles both. */
  function currentQuestion() {
    if (!run.level.boss) return run.questions[run.idx];
    var node = run.scenario.nodes[run.nodeId];
    return { id: run.scenario.id + '/' + run.nodeId, type: 'choice', speaker: node.speaker, prompt: node.text, options: node.options,
             visual: node.visual, ref: node.ref, explain: '', bossNode: true };
  }

  function hudHTML() {
    var L = run.level;
    var prog = L.boss ? '' : '<div class="progress" aria-hidden="true"><div style="width:' + (run.idx / run.total * 100) + '%"></div></div>';
    var qlabel = L.boss ? ('Decision ' + (run.answered + 1)) : ('Question ' + (run.idx + 1) + ' of ' + run.total);
    return '<div class="hud" id="hud"><div class="hud-left"><span class="lvl">L' + L.number + ' ' + esc(L.title) + '</span><span class="chip">' + qlabel + '</span></div>' +
      prog +
      '<div class="hud-right">' + heartsHTML(run.lives, S.livesPerLevel) +
      '<span class="streak' + (run.streak > 1 ? '' : ' off') + '" title="Streak">' + icon('flame') + 'x' + run.streak + '</span>' +
      '<span class="hud-score" id="hud-score">' + fmtNum(run.score) + ' pts</span>' +
      '<button class="btn ghost small-btn" id="quit-btn">Quit</button></div></div>' +
      (Store.get().timerOn ? '<div class="timerbar" id="timerbar"><div></div></div>' : '');
  }

  function renderQuestion() {
    var q = currentQuestion();
    run.current = q; run.locked = false;
    var L = run.level;
    show(
      '<div class="stack" data-qid="' + esc(q.id) + '" data-type="' + q.type + '" id="qwrap">' +
      hudHTML() +
      '<section class="card pop-in" id="qcard">' +
        speakerHTML(q.speaker || L.host, '<p>' + fmt(q.prompt, true) + '</p>') +
        '<div class="qbody" id="qbody">' + visualHTML(q.visual) + '</div>' +
        '<div class="actions" id="qactions"></div>' +
        '<div id="feedback" aria-live="polite"></div>' +
      '</section></div>', L.color);
    document.getElementById('quit-btn').addEventListener('click', function () {
      confirmModal('Quit this level?', 'Your progress in this level will not be saved.', 'Quit', function () { run = null; renderMap(); });
    });
    var body = document.getElementById('qbody');
    animateGauge(body);
    var renderer = { choice: renderChoice, order: renderOrder, match: renderMatch, spot: renderSpot }[q.type];
    renderer(q, body, document.getElementById('qactions'));
    if (Store.get().timerOn) startTimer(q.type === 'choice' && !q.multi ? S.timer.secondsPerQuestion : S.timer.secondsPerPuzzle);
  }

  /* ---------- choice (single or multi) ---------- */
  function renderChoice(q, body, actions) {
    var opts = shuffle(q.options);
    var multi = !!q.multi;
    var wrap = document.createElement('div');
    wrap.className = 'options' + (q.layout === 'tiles' ? ' tiles' : '');
    wrap.setAttribute('role', multi ? 'group' : 'radiogroup');
    opts.forEach(function (o, i) {
      var b = document.createElement('button');
      b.className = 'opt'; b.type = 'button';
      b.setAttribute('data-opt', q.options.indexOf(o));
      if (multi) b.setAttribute('aria-pressed', 'false');
      b.innerHTML = '<span class="key">' + (q.layout === 'tiles' ? icon('box') : letter(i)) + '</span><span>' + fmt(o.text, true) + '</span>';
      wrap.appendChild(b);
    });
    body.appendChild(wrap);
    var check = null;
    if (multi) {
      var counter = document.createElement('div');
      counter.className = 'kitbox'; counter.style.marginTop = '12px';
      body.appendChild(counter);
      var upd = function () { var n = wrap.querySelectorAll('.opt.selected').length; counter.innerHTML = icon('box') + '<span>' + n + ' selected</span>'; check.disabled = n === 0; };
      check = btn('Check', 'btn level big');
      actions.appendChild(check);
      wrap.addEventListener('click', function (e) {
        var b = e.target.closest('.opt'); if (!b || run.locked) return;
        b.classList.toggle('selected'); b.setAttribute('aria-pressed', b.classList.contains('selected'));
        upd();
      });
      upd();
      check.addEventListener('click', function () { evaluateChoice(q, wrap, null); });
    } else {
      wrap.addEventListener('click', function (e) {
        var b = e.target.closest('.opt'); if (!b || run.locked) return;
        evaluateChoice(q, wrap, b);
      });
    }
    run.timeout = function () { evaluateChoice(q, wrap, null, true); };
  }

  function evaluateChoice(q, wrap, clicked, timedOut) {
    var buttons = Array.prototype.slice.call(wrap.querySelectorAll('.opt'));
    var chosen = [];
    if (clicked) chosen = [Number(clicked.getAttribute('data-opt'))];
    else if (q.multi) chosen = buttons.filter(function (b) { return b.classList.contains('selected'); }).map(function (b) { return Number(b.getAttribute('data-opt')); });
    var correctIdx = q.options.map(function (o, i) { return o.correct ? i : -1; }).filter(function (i) { return i >= 0; });
    var ok = !timedOut && chosen.length === correctIdx.length && correctIdx.every(function (i) { return chosen.indexOf(i) >= 0; });
    var critical = null;
    chosen.forEach(function (i) { if (q.options[i].critical) critical = q.options[i].critical; });

    buttons.forEach(function (b) {
      var i = Number(b.getAttribute('data-opt'));
      b.disabled = true;
      if (q.options[i].correct) b.classList.add('is-correct');
      else if (chosen.indexOf(i) >= 0) b.classList.add('is-wrong');
    });
    revealGauge(wrap.parentNode);

    var lines = [];
    if (q.bossNode && chosen.length) {
      var opt = q.options[chosen[0]];
      if (opt.feedback) lines.push(fmt(opt.feedback, true));
      if (!ok) {
        var right = q.options.filter(function (o) { return o.correct; })[0];
        if (right) lines.push('<b>Better choice:</b> ' + fmt(right.text, false));
      }
    } else {
      chosen.forEach(function (i) { var o = q.options[i]; if (!o.correct && o.why) lines.push('<b>' + fmt(o.text, false) + ':</b> ' + fmt(o.why, true)); });
      if (q.multi) {
        var missed = correctIdx.filter(function (i) { return chosen.indexOf(i) < 0; });
        if (missed.length) lines.push('<b>Missed:</b> ' + missed.map(function (i) { return fmt(q.options[i].text, false); }).join(', '));
      }
      if (!ok && !q.multi) {
        var r2 = q.options.filter(function (o) { return o.correct; })[0];
        if (r2) lines.push('<b>Right answer:</b> ' + fmt(r2.text, false));
      }
    }
    if (q.explain) lines.push(fmt(q.explain, true));
    finishAnswer({ correct: ok, critical: critical, lines: lines, timedOut: timedOut, anchor: clicked || wrap, chosenNext: (q.bossNode && chosen.length) ? q.options[chosen[0]].next : (q.bossNode ? firstWrongNext(q) : undefined) });
  }
  /* On a boss timeout, continue along the path of the first wrong option. */
  function firstWrongNext(q) {
    var w = q.options.filter(function (o) { return !o.correct && !o.critical; })[0] || q.options.filter(function (o) { return o.correct; })[0];
    return w ? w.next : null;
  }

  /* ---------- order (drag and drop + arrow buttons) ---------- */
  function renderOrder(q, body, actions) {
    var items = q.items.map(function (t, i) { return { t: t, i: i }; });
    var sh = shuffle(items), guard = 0;
    while (guard++ < 10 && sh.every(function (x, k) { return x.i === k; })) sh = shuffle(items);
    var list = document.createElement('ol');
    list.className = 'order-list';
    list.setAttribute('aria-label', 'Items to put in order');
    sh.forEach(function (it) {
      var li = document.createElement('li');
      li.className = 'order-item';
      li.setAttribute('data-i', it.i);
      li.innerHTML = '<span class="pos"></span><span class="grip">' + icon('grip', '#9AA6BD', 'width="20" height="20"') + '</span><span class="txt">' + fmt(it.t, true) + '</span>' +
        '<span class="arrows"><button type="button" data-mv="-1" aria-label="Move up">&#8593;</button><button type="button" data-mv="1" aria-label="Move down">&#8595;</button></span>';
      list.appendChild(li);
    });
    body.appendChild(list);
    function renumber() {
      var lis = list.children;
      for (var k = 0; k < lis.length; k++) {
        lis[k].querySelector('.pos').textContent = k + 1;
        lis[k].querySelector('[data-mv="-1"]').disabled = run.locked || k === 0;
        lis[k].querySelector('[data-mv="1"]').disabled = run.locked || k === lis.length - 1;
      }
    }
    renumber();
    list.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-mv]'); if (!b || run.locked) return;
      var li = b.closest('li'), dir = Number(b.getAttribute('data-mv'));
      if (dir < 0 && li.previousElementSibling) list.insertBefore(li, li.previousElementSibling);
      if (dir > 0 && li.nextElementSibling) list.insertBefore(li.nextElementSibling, li);
      renumber();
      var nb = li.querySelector('[data-mv="' + dir + '"]'); (nb && !nb.disabled ? nb : li.querySelector('button:not([disabled])')).focus();
      announce('Moved to position ' + (Array.prototype.indexOf.call(list.children, li) + 1));
    });
    // Pointer drag: works with mouse, pen and touch.
    var dragging = null;
    list.addEventListener('pointerdown', function (e) {
      if (run.locked || e.target.closest('button')) return;
      var li = e.target.closest('.order-item'); if (!li) return;
      dragging = li; li.classList.add('dragging');
      try { li.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      e.preventDefault();
    });
    list.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      var y = e.clientY, sibs = Array.prototype.filter.call(list.children, function (x) { return x !== dragging; });
      var before = null;
      for (var k = 0; k < sibs.length; k++) { var r = sibs[k].getBoundingClientRect(); if (y < r.top + r.height / 2) { before = sibs[k]; break; } }
      if (before) { if (dragging.nextElementSibling !== before) list.insertBefore(dragging, before); }
      else if (list.lastElementChild !== dragging) list.appendChild(dragging);
      renumber();
    });
    var drop = function () { if (!dragging) return; dragging.classList.remove('dragging'); dragging = null; renumber(); };
    list.addEventListener('pointerup', drop);
    list.addEventListener('pointercancel', drop);

    var check = btn('Check order', 'btn level big');
    actions.appendChild(check);
    var evaluate = function (timedOut) {
      run.locked = true; list.classList.add('locked'); renumber();
      var got = Array.prototype.map.call(list.children, function (li) { return Number(li.getAttribute('data-i')); });
      var ok = !timedOut && got.every(function (v, k) { return v === k; });
      Array.prototype.forEach.call(list.children, function (li, k) { li.classList.add(Number(li.getAttribute('data-i')) === k ? 'ok' : 'no'); });
      check.disabled = true;
      var lines = [];
      if (!ok) lines.push('<b>Correct order:</b><ol>' + q.items.map(function (t) { return '<li>' + fmt(t, false) + '</li>'; }).join('') + '</ol>');
      if (q.explain) lines.push(fmt(q.explain, true));
      finishAnswer({ correct: ok, critical: null, lines: lines, timedOut: timedOut, anchor: check });
    };
    check.addEventListener('click', function () { evaluate(false); });
    run.timeout = function () { evaluate(true); };
  }

  /* ---------- match (task to role) ---------- */
  function renderMatch(q, body, actions) {
    var pairs = shuffle(q.pairs);
    var wrap = document.createElement('div');
    pairs.forEach(function (p, r) {
      var row = document.createElement('div');
      row.className = 'match-row';
      row.setAttribute('data-task', q.pairs.indexOf(p));
      row.innerHTML = '<div class="match-task" id="mt-' + r + '">' + fmt(p.task, true) + '</div>' +
        '<div class="role-chips" role="radiogroup" aria-labelledby="mt-' + r + '">' +
        q.roles.map(function (role) { return '<button type="button" class="role-chip" role="radio" aria-checked="false" data-role="' + esc(role) + '">' + fmt(role, false) + '</button>'; }).join('') +
        '</div>';
      wrap.appendChild(row);
    });
    body.appendChild(wrap);
    var check = btn('Check', 'btn level big');
    check.disabled = true;
    actions.appendChild(check);
    wrap.addEventListener('click', function (e) {
      var c = e.target.closest('.role-chip'); if (!c || run.locked) return;
      c.parentNode.querySelectorAll('.role-chip').forEach(function (x) { x.setAttribute('aria-checked', 'false'); });
      c.setAttribute('aria-checked', 'true');
      check.disabled = wrap.querySelectorAll('.role-chip[aria-checked="true"]').length < q.pairs.length;
    });
    var evaluate = function (timedOut) {
      run.locked = true; check.disabled = true;
      var allOk = !timedOut, lines = [];
      wrap.querySelectorAll('.match-row').forEach(function (row) {
        var p = q.pairs[Number(row.getAttribute('data-task'))];
        var sel = row.querySelector('.role-chip[aria-checked="true"]');
        var got = sel ? sel.getAttribute('data-role') : null;
        var ok = got === p.role;
        if (!ok) { allOk = false; lines.push('<b>' + fmt(p.task, false) + '</b>: ' + fmt(p.role, false)); }
        row.classList.add(ok ? 'ok' : 'no');
        row.querySelectorAll('.role-chip').forEach(function (c) { c.disabled = true; if (!ok && c.getAttribute('data-role') === p.role) c.classList.add('right'); });
      });
      if (lines.length) lines = ['<b>Correct owners:</b><ul><li>' + lines.join('</li><li>') + '</li></ul>'];
      if (q.explain) lines.push(fmt(q.explain, true));
      finishAnswer({ correct: allOk, critical: null, lines: lines, timedOut: timedOut, anchor: check });
    };
    check.addEventListener('click', function () { evaluate(false); });
    run.timeout = function () { evaluate(true); };
  }

  /* ---------- spot the error (mock form) ---------- */
  function renderSpot(q, body, actions) {
    var doc = q.doc;
    var paper = document.createElement('div');
    paper.className = 'paper';
    paper.innerHTML = '<h3>' + fmt(doc.title, false) + '</h3><div class="paper-sub">' + fmt(doc.subtitle || '', false) + '</div>' +
      doc.fields.map(function (f, i) {
        return '<button type="button" class="field" aria-pressed="false" data-f="' + i + '"><span class="flabel">' + fmt(f.label, false) + '</span><span class="fval">' + fmt(f.value, false) + '</span><span class="mark">' + icon('cross', '#fff', 'width="16" height="16"') + '</span></button>';
      }).join('');
    body.appendChild(paper);
    var counter = document.createElement('p');
    counter.className = 'muted small'; counter.style.marginTop = '10px';
    body.appendChild(counter);
    var check = btn('Submit review', 'btn level big');
    actions.appendChild(check);
    var upd = function () { var n = paper.querySelectorAll('.field[aria-pressed="true"]').length; counter.textContent = n + ' field(s) marked as wrong.'; check.disabled = n === 0; };
    upd();
    paper.addEventListener('click', function (e) {
      var f = e.target.closest('.field'); if (!f || run.locked) return;
      f.setAttribute('aria-pressed', f.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
      upd();
    });
    var evaluate = function (timedOut) {
      run.locked = true; check.disabled = true;
      var ok = !timedOut, critical = null, found = [], missed = [], wrongFlags = [];
      paper.querySelectorAll('.field').forEach(function (el) {
        var f = doc.fields[Number(el.getAttribute('data-f'))];
        var flagged = el.getAttribute('aria-pressed') === 'true';
        el.disabled = true;
        if (f.error && flagged) { el.classList.add('found'); found.push(f); }
        else if (f.error && !flagged) { el.classList.add('missed'); missed.push(f); ok = false; if (f.critical) critical = f.critical; }
        else if (!f.error && flagged) { el.classList.add('false-flag'); wrongFlags.push(f); ok = false; }
        el.querySelector('.mark').innerHTML = f.error ? icon(flagged ? 'check' : 'cross', '#fff', 'width="16" height="16"') : '';
      });
      var lines = [];
      if (found.length) lines.push('<b>Found:</b><ul>' + found.map(function (f) { return '<li><b>' + fmt(f.label, false) + '</b>: ' + fmt(f.why, true) + '</li>'; }).join('') + '</ul>');
      if (missed.length) lines.push('<b>Missed:</b><ul>' + missed.map(function (f) { return '<li><b>' + fmt(f.label, false) + '</b>: ' + fmt(f.why, true) + '</li>'; }).join('') + '</ul>');
      if (wrongFlags.length) lines.push('<b>These were fine:</b> ' + wrongFlags.map(function (f) { return fmt(f.label, false); }).join(', '));
      if (q.explain) lines.push(fmt(q.explain, true));
      finishAnswer({ correct: ok, critical: critical, lines: lines, timedOut: timedOut, anchor: check });
    };
    check.addEventListener('click', function () { evaluate(false); });
    run.timeout = function () { evaluate(true); };
  }

  function btn(label, cls) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = cls || 'btn'; b.textContent = label;
    return b;
  }

  /* ===========================================================================
   * 7. SCORING, LIVES, CRITICAL RULES
   * ========================================================================= */
  function finishAnswer(res) {
    stopTimer();
    run.locked = true;
    var q = run.current;
    run.answered++;
    var gained = 0;
    if (res.correct) {
      run.correct++;
      run.streak++;
      run.maxStreak = Math.max(run.maxStreak, run.streak);
      gained = S.pointsPerCorrect + Math.min(S.streakBonus * (run.streak - 1), S.streakBonusMax);
      run.score += gained;
      burst(res.anchor);
    } else {
      run.streak = 0;
      run.mistakes.push({ qid: q.id, ref: q.ref || '', topic: run.level.topic });
      if (!res.critical) { run.lives--; run.livesLost++; }
    }
    var d = Store.get();
    if (run.maxStreak > (d.bestStreak || 0)) { d.bestStreak = run.maxStreak; Store.save(); }

    // refresh HUD
    var hud = document.getElementById('hud');
    if (hud) {
      var tmp = document.createElement('div'); tmp.innerHTML = hudHTML();
      hud.replaceWith(tmp.firstElementChild);
      document.getElementById('quit-btn').addEventListener('click', function () {
        confirmModal('Quit this level?', 'Your progress in this level will not be saved.', 'Quit', function () { run = null; renderMap(); });
      });
      var tb = document.getElementById('timerbar'); if (tb) tb.remove();
      if (!res.correct && !res.critical) {
        var hearts = document.querySelectorAll('#hud [data-heart]');
        var lost = hearts[run.lives]; if (lost) lost.classList.add('heart-lost');
        document.getElementById('hud').classList.add('shake');
        document.getElementById('qcard').classList.add('shake');
      }
    }

    if (res.critical) { run.critical = res.critical; return showCriticalModal(res); }

    var good = res.correct;
    var title = good ? 'Correct!' : (res.timedOut ? 'Time is up' : 'Not quite');
    var last = run.lives <= 0;
    var endOfLevel = run.level.boss ? (res.chosenNext == null) : (run.idx + 1 >= run.total);
    var nextLabel = last ? 'See what happened' : (endOfLevel ? 'Finish level' : 'Next');
    var fb = document.getElementById('feedback');
    fb.innerHTML = '<div class="feedback ' + (good ? 'good' : 'bad') + ' pop-in">' +
      '<h3>' + icon(good ? 'check' : 'cross', good ? 'var(--ok)' : 'var(--bad)', 'width="28" height="28"') + esc(title) +
      (good ? ' <span class="points-pop">+' + gained + '</span>' : '') + '</h3>' +
      res.lines.map(function (l) { return '<div>' + l + '</div>'; }).join('') +
      '<div class="fb-foot">' + (q.ref ? '<span class="chip ref-chip">' + esc(q.ref) + '</span>' : '<span></span>') +
      '<button class="btn level big" id="next-btn">' + nextLabel + '</button></div></div>';
    var nb = document.getElementById('next-btn');
    nb.focus({ preventScroll: true });
    fb.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'nearest' });
    announce(title);
    nb.addEventListener('click', function () {
      if (last) return endLevel('failed');
      if (run.level.boss) {
        if (res.chosenNext == null) return endLevel('completed');
        run.nodeId = res.chosenNext; return renderQuestion();
      }
      run.idx++;
      if (run.idx >= run.total) return endLevel('completed');
      renderQuestion();
    });
  }

  function showCriticalModal(res) {
    var rule = C.criticalRules[res.critical] || { title: 'Critical rule', rule: '', ref: '' };
    openModal(
      '<div class="modal-head">' + icon('lock', '#fff', 'width="30" height="30"') + '<h2>Critical rule broken</h2></div>' +
      '<div class="modal-body">' +
        '<p>This mistake ends the level immediately.</p>' +
        '<div class="rule-box"><b>' + fmt(rule.title, true) + '</b><p style="margin:.4em 0 0">' + fmt(rule.rule, true) + '</p></div>' +
        res.lines.map(function (l) { return '<div>' + l + '</div>'; }).join('') +
        '<p><span class="chip ref-chip">' + esc(rule.ref) + '</span></p>' +
        '<div class="actions"><button class="btn" id="crit-ok">Continue</button></div>' +
      '</div>', function () { endLevel('critical'); });
    document.getElementById('crit-ok').addEventListener('click', function () { closeModal(); endLevel('critical'); });
  }

  function starsFor(acc) {
    var st = S.stars;
    return acc >= st.three ? 3 : acc >= st.two ? 2 : acc >= st.one ? 1 : 0;
  }

  /* ResultRecord: one row per level attempt. This is the shape to send to a
   * future leaderboard / results backend (see README, "Adding a backend"). */
  function makeResultRecord(status) {
    var acc = run.answered ? run.correct / run.answered : 0;
    return {
      player: Store.get().player || '',
      levelId: run.level.id,
      levelTitle: run.level.title,
      scenarioId: run.scenario ? run.scenario.id : null,
      status: status,                         // completed | failed | critical
      criticalRule: run.critical,
      score: run.score,
      correct: run.correct,
      answered: run.answered,
      accuracy: Math.round(acc * 1000) / 1000,
      stars: status === 'completed' ? starsFor(acc) : 0,
      livesLost: run.livesLost,
      maxStreak: run.maxStreak,
      mistakes: run.mistakes.slice(),         // [{ qid, ref, topic }]
      timerOn: !!Store.get().timerOn,
      startedAt: run.startedAt,
      finishedAt: new Date().toISOString(),
      contentVersion: C.meta.version
    };
  }

  function endLevel(status) {
    stopTimer();
    var d = Store.get(), L = run.level;
    var rec = makeResultRecord(status);
    var lv = d.levels[L.id] || { completed: false, best: null, last: null };
    lv.last = { score: rec.score, correct: rec.correct, total: rec.answered, accuracy: rec.accuracy, stars: rec.stars, status: status, mistakes: rec.mistakes, date: rec.finishedAt };
    var newBest = false;
    if (status === 'completed') {
      lv.completed = true;
      if (!lv.best || rec.score > lv.best.score || (rec.score === lv.best.score && rec.accuracy > lv.best.accuracy)) {
        lv.best = { score: rec.score, correct: rec.correct, total: rec.answered, accuracy: rec.accuracy, stars: rec.stars, date: rec.finishedAt };
        newBest = true;
      } else if (rec.stars > lv.best.stars) { lv.best.stars = rec.stars; }
      if (rec.livesLost === 0) d.flawless = true;
    }
    d.levels[L.id] = lv;
    if (C.levels.every(function (x) { return d.levels[x.id] && d.levels[x.id].completed; })) d.allDoneOnce = true;
    d.results.push(rec);
    if (d.results.length > 300) d.results = d.results.slice(-300);
    var newBadges = updateBadges();
    Store.save();
    renderLevelEnd(rec, newBest, newBadges);
  }

  /* ---------- Level end screen ---------- */
  function renderLevelEnd(rec, newBest, newBadges) {
    var L = run.level, idx = levelIndex(L.id), next = C.levels[idx + 1];
    var completed = rec.status === 'completed';
    var title = completed ? 'Level complete!' : (rec.status === 'critical' ? 'Level lost: critical rule' : 'Out of lives');
    var weak = groupRefs(rec.mistakes);
    var host = completed ? (rec.accuracy >= S.passMark ? 'Great running. The pipeline keeps flowing.' : 'Done, but some answers slipped. Check the sections below and try again.')
                         : (rec.status === 'critical' ? 'That one stops the pipeline. Read the rule again, then retry.' : 'Three mistakes and the level stops. Review the sections below and retry.');
    var nextOpen = next && isUnlocked(idx + 1);
    show(
      '<section class="card stack pop-in center">' +
        '<h2 style="font-size:34px">' + esc(title) + '</h2>' +
        (completed ? '<div class="big-stars">' + [0, 1, 2].map(function (i) { return '<span class="' + (i < rec.stars ? 'on' : '') + '">' + icon('star', i < rec.stars ? 'var(--gold)' : '#D5DDEB') + '</span>'; }).join('') + '</div>' : '') +
        '<div class="result-grid">' +
          '<div class="stat"><b>' + fmtNum(rec.score) + '</b><span>Points' + (newBest ? ' (new best!)' : '') + '</span></div>' +
          '<div class="stat"><b>' + rec.correct + '/' + rec.answered + '</b><span>Correct</span></div>' +
          '<div class="stat"><b>' + pct(rec.accuracy) + '</b><span>Accuracy</span></div>' +
          '<div class="stat"><b>x' + rec.maxStreak + '</b><span>Best streak</span></div>' +
        '</div>' +
        '<div style="text-align:left">' + speakerHTML(L.host, '<p>' + esc(host) + '</p>') + '</div>' +
        (weak.length ? '<div style="text-align:left"><h3>Review these sections</h3><ul class="weak">' + weak.map(function (w) { return '<li><span class="chip ref-chip">' + esc(w.ref) + '</span> ' + w.count + ' mistake' + (w.count > 1 ? 's' : '') + '</li>'; }).join('') + '</ul></div>' : '') +
        (newBadges.length ? '<div style="text-align:left"><h3>New badge' + (newBadges.length > 1 ? 's' : '') + '!</h3><div class="badges">' + newBadges.map(function (b) { return badgeHTML(b, true, true); }).join('') + '</div></div>' : '') +
        '<div class="actions" style="justify-content:center">' +
          '<button class="btn secondary" data-go="map">Map</button>' +
          '<button class="btn ' + (completed ? 'secondary' : 'level big') + '" id="retry-btn">' + (completed ? 'Replay level' : 'Retry level') + '</button>' +
          (completed && nextOpen ? '<button class="btn big" id="next-level-btn">Next: ' + esc(next.title) + '</button>' : '') +
          (completed && !next ? '<button class="btn big" id="report-end-btn">Final report</button>' : '') +
        '</div>' +
      '</section>', L.color);
    document.getElementById('retry-btn').addEventListener('click', function () { renderLevelIntro(L.id); });
    var nl = document.getElementById('next-level-btn'); if (nl) { nl.addEventListener('click', function () { renderLevelIntro(next.id); }); nl.focus(); }
    var rp = document.getElementById('report-end-btn'); if (rp) { rp.addEventListener('click', renderReport); rp.focus(); }
    if (completed) confetti(); else document.querySelector('main .card').classList.add('shake');
  }

  function groupRefs(mistakes) {
    var m = {};
    mistakes.forEach(function (x) { var k = x.ref || 'General'; m[k] = (m[k] || 0) + 1; });
    return Object.keys(m).map(function (k) { return { ref: k, count: m[k] }; }).sort(function (a, b) { return b.count - a.count; });
  }

  /* ---------- Overall stats, ranks, badges ---------- */
  function overall() {
    var d = Store.get(), score = 0, correct = 0, total = 0, stars = 0, completed = 0;
    C.levels.forEach(function (L) {
      var r = d.levels[L.id];
      if (r && r.best) { score += r.best.score; correct += r.best.correct; total += r.best.total; stars += r.best.stars; }
      if (r && r.completed) completed++;
    });
    var acc = total ? correct / total : 0;
    var all = completed === C.levels.length;
    var rank = C.ranks[0];
    C.ranks.forEach(function (rk) { if (acc >= rk.minAccuracy && (!rk.requireAllLevels || all)) rank = rk; });
    return { score: score, correct: correct, total: total, accuracy: acc, stars: stars, completed: completed, allDone: all, rank: rank, passed: all && acc >= S.passMark };
  }

  function badgeEarned(b) {
    var d = Store.get(), parts = b.rule.split(':'), kind = parts[0], arg = parts[1];
    var lv = arg ? d.levels[arg] : null;
    switch (kind) {
      case 'levelDone': return !!(lv && lv.completed);
      case 'stars3': return !!(lv && lv.best && lv.best.stars === 3);
      case 'flawless': return !!d.flawless;
      case 'streak': return (d.bestStreak || 0) >= Number(arg);
      case 'allLevels': return overall().allDone;
      case 'noCritical': return C.levels.every(function (L) { var r = d.levels[L.id]; return r && r.last && r.last.status === 'completed'; });
      case 'rank': return overall().rank.id === arg;
    }
    return false;
  }
  function updateBadges() {
    var d = Store.get(), fresh = [];
    C.badges.forEach(function (b) {
      if (d.badges.indexOf(b.id) < 0 && badgeEarned(b)) { d.badges.push(b.id); fresh.push(b); }
    });
    return fresh;
  }
  function badgeHTML(b, on, isNew) {
    return '<div class="badge' + (on ? '' : ' off') + (isNew ? ' new' : '') + '">' + icon(b.icon, on ? 'var(--blue)' : '#9AA6BD') + '<b>' + esc(b.title) + '</b>' + esc(b.desc) + '</div>';
  }

  /* ---------- Final report ---------- */
  function renderReport() {
    var d = Store.get(), o = overall();
    var allMistakes = [];
    C.levels.forEach(function (L) { var r = d.levels[L.id]; if (r && r.last) allMistakes = allMistakes.concat(r.last.mistakes || []); });
    var weak = groupRefs(allMistakes);
    var rows = C.levels.map(function (L) {
      var r = d.levels[L.id] || {}, b = r.best;
      return '<tr><td><b>' + L.number + '. ' + esc(L.title) + '</b><br><span class="small muted">' + esc(L.topic) + '</span></td>' +
        '<td>' + starsHTML(b ? b.stars : 0) + '</td>' +
        '<td>' + (b ? fmtNum(b.score) : '-') + '</td>' +
        '<td>' + (b ? b.correct + '/' + b.total + ' (' + pct(b.accuracy) + ')' : (r.last ? 'Not completed' : 'Not played')) + '</td></tr>';
    }).join('');
    var banner = o.passed
      ? '<div class="pass-banner pass">Passed! Overall accuracy ' + pct(o.accuracy) + ' (pass mark ' + pct(S.passMark) + ').</div>'
      : '<div class="pass-banner fail">' + (o.allDone ? 'Not passed yet: overall accuracy ' + pct(o.accuracy) + ', pass mark ' + pct(S.passMark) + '. Replay levels to raise your best scores.'
                                                     : 'Complete all ' + C.levels.length + ' levels to get a final result (' + o.completed + ' done so far).') + '</div>';
    show(
      '<div class="stack">' +
      '<section class="card stack pop-in"><h2>Final report</h2>' + banner +
        '<div class="result-grid">' +
          '<div class="stat"><b>' + fmtNum(o.score) + '</b><span>Total score (best per level)</span></div>' +
          '<div class="stat"><b>' + pct(o.accuracy) + '</b><span>Overall accuracy</span></div>' +
          '<div class="stat"><b>' + o.stars + '/' + (C.levels.length * 3) + '</b><span>Stars</span></div>' +
          '<div class="stat"><b>' + esc(o.rank.title) + '</b><span>' + esc(o.rank.note) + '</span></div>' +
        '</div>' +
        '<div style="overflow-x:auto"><table class="report"><thead><tr><th>Level</th><th>Stars</th><th>Best score</th><th>Accuracy</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '</section>' +
      '<section class="card stack"><h2>Weak areas</h2>' +
        (weak.length ? '<p class="muted">From your latest attempt at each level, by source section. Re-read these in the SOP or budget tool.</p><ul class="weak">' +
          weak.map(function (w) { return '<li><span class="chip ref-chip">' + esc(w.ref) + '</span> ' + w.count + ' mistake' + (w.count > 1 ? 's' : '') + '</li>'; }).join('') + '</ul>'
          : '<p>No mistakes in your latest attempts. Excellent.</p>') +
      '</section>' +
      '<section class="card stack"><h2>Badges</h2><div class="badges">' + C.badges.map(function (b) { return badgeHTML(b, d.badges.indexOf(b.id) >= 0); }).join('') + '</div></section>' +
      '<div class="actions">' +
        '<button class="btn secondary" data-go="map">Map</button>' +
        '<button class="btn secondary" id="export-btn">Export results (JSON)</button>' +
        '<button class="btn big" id="card-btn"' + (o.passed ? '' : ' disabled title="Pass the run to unlock"') + '>Completion card</button>' +
      '</div></div>'
    );
    document.getElementById('export-btn').addEventListener('click', exportResults);
    document.getElementById('card-btn').addEventListener('click', showCard);
    if (o.passed) confetti();
  }

  /* ---------- Completion card ---------- */
  function cardHTML() {
    var d = Store.get(), o = overall();
    var date = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
    return '<div class="cc">' +
      '<div class="cc-top">IOM South Sudan | Core Pipeline training</div>' +
      '<h2>' + esc(C.meta.title) + ' completion card</h2>' +
      '<div>This card confirms that</div>' +
      '<div class="cc-name">' + esc(d.player || 'Player') + '</div>' +
      '<div>completed all ' + C.levels.length + ' levels of the SNFI and WASH Core Pipeline training game.</div>' +
      '<div class="cc-grid"><div><b>' + fmtNum(o.score) + '</b>Score</div><div><b>' + pct(o.accuracy) + '</b>Accuracy</div><div><b>' + esc(o.rank.title) + '</b>Rank</div><div><b>' + esc(date) + '</b>Date</div></div>' +
      '<div class="cc-levels">' + C.levels.map(function (L) { var r = d.levels[L.id]; return '<span>' + L.number + '. ' + esc(L.title) + ' ' + '&#9733;'.repeat(r && r.best ? r.best.stars : 0) + '</span>'; }).join('') + '</div>' +
      '<div class="cc-foot">Pass mark ' + pct(S.passMark) + '. ' + esc(C.meta.sourceNote) + ' Training record, not an official certification.</div>' +
      '</div>';
  }
  function showCard() {
    var html = cardHTML();
    document.getElementById('print-card').innerHTML = html;
    openModal('<div class="modal-head info"><h2>Your completion card</h2></div><div class="modal-body">' +
      '<div style="transform-origin:top left">' + html + '</div>' +
      '<div class="actions"><button class="btn secondary" id="card-close">Close</button><button class="btn" id="card-print">Print or save as PDF</button></div></div>');
    document.querySelector('.modal').style.maxWidth = '860px';
    document.getElementById('card-close').addEventListener('click', closeModal);
    document.getElementById('card-print').addEventListener('click', function () { window.print(); });
  }

  /* ===========================================================================
   * 8. RESULTS EXPORT
   * Downloads everything as JSON. A future shared leaderboard can POST the
   * same `results` records (see makeResultRecord) to a backend instead.
   * ========================================================================= */
  function exportResults() {
    var d = Store.get(), o = overall();
    var payload = {
      exportedAt: new Date().toISOString(), game: C.meta.title, contentVersion: C.meta.version,
      player: d.player,
      summary: { totalScore: o.score, accuracy: Math.round(o.accuracy * 1000) / 1000, stars: o.stars, levelsCompleted: o.completed, rank: o.rank.title, passed: o.passed, passMark: S.passMark },
      levels: d.levels, badges: d.badges, results: d.results
    };
    try {
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'pipeline-runner-results-' + (d.player || 'player').replace(/[^A-Za-z0-9]+/g, '_') + '-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    } catch (e) { alert('Export is not available in this browser.'); }
  }

  /* ===========================================================================
   * MODALS, TIMER, EFFECTS
   * ========================================================================= */
  var modalOnClose = null;
  function openModal(inner, onEsc) {
    var root = document.getElementById('overlay-root');
    root.innerHTML = '<div class="overlay"><div class="modal pop-in" role="dialog" aria-modal="true">' + inner + '</div></div>';
    modalOnClose = onEsc || null;
    var f = root.querySelector('button'); if (f) f.focus();
  }
  function closeModal() { document.getElementById('overlay-root').innerHTML = ''; modalOnClose = null; }
  function confirmModal(title, text, okLabel, onOk) {
    openModal('<div class="modal-head info"><h2>' + esc(title) + '</h2></div><div class="modal-body"><p>' + esc(text) + '</p>' +
      '<div class="actions"><button class="btn secondary" id="m-cancel">Cancel</button><button class="btn" id="m-ok">' + esc(okLabel) + '</button></div></div>');
    document.getElementById('m-cancel').addEventListener('click', closeModal);
    document.getElementById('m-ok').addEventListener('click', function () { closeModal(); onOk(); });
  }
  function showRulesModal() {
    resetAcronyms();
    var ids = Object.keys(C.criticalRules);
    openModal('<div class="modal-head">' + icon('lock', '#fff', 'width="30" height="30"') + '<h2>Critical rules</h2></div><div class="modal-body">' +
      '<p>Breaking any of these ends the level immediately.</p><div class="rule-list">' +
      ids.map(function (id) { var r = C.criticalRules[id]; return '<div class="rule-box"><b>' + fmt(r.title, true) + '</b><p style="margin:.3em 0">' + fmt(r.rule, true) + '</p><span class="chip ref-chip">' + esc(r.ref) + '</span></div>'; }).join('') +
      '</div><div class="actions"><button class="btn" id="m-close">Got it</button></div></div>');
    document.getElementById('m-close').addEventListener('click', closeModal);
  }

  function startTimer(seconds) {
    stopTimer();
    var end = Date.now() + seconds * 1000;
    timerHandle = setInterval(function () {
      var left = (end - Date.now()) / 1000;
      var bar = document.getElementById('timerbar');
      if (bar) { bar.firstElementChild.style.width = Math.max(0, left / seconds * 100) + '%'; bar.classList.toggle('low', left < 10); }
      if (left <= 0) { stopTimer(); if (run && !run.locked && run.timeout) run.timeout(); }
    }, 200);
  }
  function stopTimer() { if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } }

  function burst(anchor) {
    if (reduceMotion || !anchor || !anchor.getBoundingClientRect) return;
    var r = anchor.getBoundingClientRect(), fx = document.getElementById('fx');
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    var colors = ['#F5B301', '#00A889', '#19A7E0', '#E5554F', '#7A5CFA'];
    for (var i = 0; i < 18; i++) {
      var s = document.createElement('span'), a = (Math.PI * 2 * i) / 18, dist = 60 + Math.random() * 50;
      s.className = 'spark';
      s.style.left = cx + 'px'; s.style.top = cy + 'px'; s.style.background = colors[i % colors.length];
      s.style.setProperty('--dx', Math.cos(a) * dist + 'px'); s.style.setProperty('--dy', Math.sin(a) * dist + 'px');
      fx.appendChild(s);
      setTimeout(function (n) { n.remove(); }.bind(null, s), 800);
    }
  }
  function confetti() {
    if (reduceMotion) return;
    var fx = document.getElementById('fx');
    var colors = ['#0033A0', '#F5B301', '#00A889', '#19A7E0', '#E5554F', '#7A5CFA', '#D6246E'];
    for (var i = 0; i < 90; i++) {
      var c = document.createElement('span');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = (1.8 + Math.random() * 1.8) + 's';
      c.style.animationDelay = (Math.random() * 0.5) + 's';
      c.style.setProperty('--dx', (Math.random() * 200 - 100) + 'px');
      c.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
      fx.appendChild(c);
      setTimeout(function (n) { n.remove(); }.bind(null, c), 4200);
    }
  }

  /* ---------- Global navigation ---------- */
  document.addEventListener('click', function (e) {
    var g = e.target.closest('[data-go]');
    if (!g) return;
    var where = g.getAttribute('data-go');
    var go = function () { run = null; closeModal(); if (where === 'home') renderHome(); else renderMap(); };
    if (run && !run.locked && document.getElementById('qwrap')) {
      confirmModal('Leave this level?', 'Your progress in this level will not be saved.', 'Leave', go);
    } else go();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && document.querySelector('.overlay')) {
      var cb = modalOnClose; closeModal(); if (cb) cb();
    }
  });

  // Expose a read-only hook for automated play-testing.
  window.PipelineRunner = { overall: overall, store: function () { return Store.get(); } };

  renderHome();
})();
</script>
</body>
</html>
